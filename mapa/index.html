<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa del Ecosistema | Sergio Lubezky</title>
    <meta name="description" content="Cartografía estratégica y mapa de contenidos del ecosistema completo de Sergio Lubezky.">
    <meta name="author" content="Sergio Lubezky">
    <link rel="canonical" href="https://lubezky.com/mapa/" />

    <style>
        body { margin: 0; display: flex; flex-direction: column; min-height: 100vh; background-color: #fbfbfb; color: #1a1a1a; font-family: 'Helvetica Neue', Arial, sans-serif; line-height: 1.5; -webkit-font-smoothing: antialiased; }
        
        main { flex: 1; padding: 60px 0 40px 0; width: 100%; box-sizing: border-box; display: flex; flex-direction: column; }
        
        .header-title { text-align: center; margin-bottom: 25px; padding: 0 20px; }
        .header-title h1 { font-size: 2.2rem; font-weight: 700; text-transform: uppercase; letter-spacing: 4px; margin: 0; }
        .header-title p { font-family: 'Georgia', serif; font-style: italic; font-size: 1.1rem; color: #555; margin-top: 10px; }

        /* Navegación sutil: solo borde, sin relleno pesado */
        .map-navigation {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            padding: 0 20px;
        }
        
        .nav-btn {
            background: transparent;
            color: #1a1a1a;
            border: 2px solid #1a1a1a;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        
        .nav-btn:hover:not(:disabled) {
            background: #1a1a1a;
            color: #fff;
            transform: scale(1.05);
        }
        
        .nav-btn:disabled {
            border-color: #ccc;
            color: #ccc;
            cursor: not-allowed;
            opacity: 0.4;
        }
        
        .nav-btn:focus {
            outline: 2px solid #d32f2f;
            outline-offset: 2px;
        }

        /* Contenedor maestro del scroll */
        .scroll-master-wrapper {
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch; /* Suavidad nativa en iOS */
            scroll-snap-type: x mandatory;
            position: relative;
            /* Truco para escritorio: convierte scroll vertical de mouse en horizontal */
            transform: rotateX(180deg);
            -ms-transform: rotateX(180deg); 
            -webkit-transform: rotateX(180deg); 
        }
        
        .scroll-master-wrapper::-webkit-scrollbar { height: 6px; }
        .scroll-master-wrapper::-webkit-scrollbar-track { background: #f1f1f1; }
        .scroll-master-wrapper::-webkit-scrollbar-thumb { background: #1a1a1a; border-radius: 3px; }
        .scroll-master-wrapper::-webkit-scrollbar-thumb:hover { background: #d32f2f; }

        .horizontal-scroll-container {
            display: flex;
            flex-direction: row;
            gap: 40px;
            padding: 20px 40px 40px 40px;
            width: max-content;
            /* Invierte el contenido para que se vea derecho tras la rotación del wrapper */
            transform: rotateX(180deg);
            -ms-transform: rotateX(180deg); 
            -webkit-transform: rotateX(180deg); 
        }

        .map-station {
            flex: 0 0 320px;
            background: #ffffff;
            border-top: 3px solid #1a1a1a;
            padding: 30px 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
            display: flex;
            flex-direction: column;
            height: fit-content;
            transition: transform 0.3s ease, border-color 0.3s ease;
            scroll-snap-align: start;
            opacity: 0;
            animation: fadeInUp 0.6s ease forwards;
        }
        
        .map-station:nth-child(1) { animation-delay: 0.1s; }
        .map-station:nth-child(2) { animation-delay: 0.2s; }
        .map-station:nth-child(3) { animation-delay: 0.3s; }
        .map-station:nth-child(4) { animation-delay: 0.4s; }
        .map-station:nth-child(5) { animation-delay: 0.5s; }
        .map-station:nth-child(6) { animation-delay: 0.6s; }
        .map-station:nth-child(7) { animation-delay: 0.7s; }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .map-station:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,0.06); border-top-color: #d32f2f; }
        .map-station.core-identity { border-top-color: #1a1a1a; background: #ffffff; }
        .map-station.core-identity:hover { border-top-color: #d32f2f; }

        .station-header { margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .station-title { font-size: 1.15rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin: 0 0 4px 0; }
        .station-domain { font-size: 0.85rem; color: #666; text-decoration: none; font-weight: 500; }
        .station-domain:hover { color: #000; }

        .nodes-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 14px; }
        .nodes-list li { font-family: 'Georgia', serif; font-size: 1.05rem; display: flex; flex-direction: column; line-height: 1.3; }
        
        .nodes-list a { color: #222; text-decoration: none; border-bottom: 1px solid transparent; transition: all 0.2s; width: fit-content; }
        .nodes-list a:hover { color: #d32f2f; border-bottom: 1px solid #d32f2f; }

        .tag { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.65rem; font-weight: bold; text-transform: uppercase; color: #a0a0a0; margin-bottom: 3px; letter-spacing: 0.5px; }

        /* Indicadores de scroll sutiles */
        .scroll-indicator {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.85);
            color: #1a1a1a;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            pointer-events: none; /* No interfiere con clicks o touch */
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 10;
            border: 1px solid #e0e0e0;
            backdrop-filter: blur(4px);
        }
        .scroll-indicator.left { left: 10px; }
        .scroll-indicator.right { right: 10px; }
        .scroll-indicator.visible { opacity: 0.6; }

        footer { padding: 80px 20px 40px; background: #fff; border-top: 1px solid #f2f2f2; }
        .footer-container { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: 1.5fr 1fr; gap: 60px; text-align: left; }
        
        .footer-col h3 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #888; margin-top: 0; margin-bottom: 20px; }
        .footer-col p { color: #555; margin: 0 0 20px 0; font-size: 0.9rem; text-align: justify; line-height: 1.6; }
        
        .footer-col ul { list-style: none; padding: 0; margin: 0; text-align: left; }
        .footer-col ul li { margin-bottom: 12px; }
        .footer-col ul li a { color: #1a1a1a; text-decoration: none; font-weight: 600; font-size: 0.9rem; border-bottom: 1px solid #eee; transition: all 0.3s; }
        .footer-col ul li a:hover { border-bottom: 1px solid #1a1a1a; }
        .footer-col ul li a.active-map { color: #d32f2f !important; border-bottom: 1px solid #f9ebeb; }
        .footer-col ul li a.active-map:hover { border-bottom: 1px solid #d32f2f; }
        
        .social-row { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 15px; justify-content: flex-start; }
        .social-row a { font-size: 0.85rem; font-weight: bold; color: #666; text-decoration: none; transition: color 0.2s; border-bottom: 1px solid #eee; }
        .social-row a:hover { color: #000; border-bottom: 1px solid #000; }

        .contact-email { margin-top: 12px; }
        .contact-email a { font-size: 0.9rem; font-weight: 600; color: #1a1a1a; text-decoration: none; border-bottom: 1px solid #ddd; transition: all 0.2s; }
        .contact-email a:hover { color: #d32f2f; border-bottom: 1px solid #d32f2f; }

        .copyright { font-size: 0.8rem; color: #999; margin-top: 35px; display: block; text-align: left; }

        /* ==========================================
           RESPONSIVE: Mantiene scroll HORIZONTAL 
           pero optimizado para pantallas táctiles
           ========================================== */
        @media (max-width: 768px) {
            .header-title h1 { font-size: 1.8rem; letter-spacing: 2px; }
            .header-title p { font-size: 1rem; }

            .map-navigation {
                gap: 10px;
                margin-bottom: 15px;
            }
            .nav-btn {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }

            /* Desactivamos el truco de rotación en móvil para que el 
               deslizamiento táctil (swipe izquierda/derecha) sea 100% nativo */
            .scroll-master-wrapper {
                transform: none;
                -ms-transform: none;
                -webkit-transform: none;
            }
            .horizontal-scroll-container {
                transform: none;
                -ms-transform: none;
                -webkit-transform: none;
                padding: 20px;
                gap: 20px;
            }

            /* Tarjetas un poco más estrechas para que se "asome" la siguiente, 
               invitando al usuario a deslizar */
            .map-station {
                flex: 0 0 280px;
                padding: 25px 20px;
                animation: none; /* Mejor rendimiento en móvil */
                opacity: 1;
            }

            .scroll-indicator { display: none; } /* En táctil el swipe es obvio */

            footer { padding: 50px 20px 30px; }
            .footer-container { 
                grid-template-columns: 1fr; 
                gap: 30px; 
                text-align: center; 
            }
            .footer-col p { text-align: center; margin: 0 auto 20px auto; max-width: 34rem; }
            .footer-col ul { text-align: center; display: inline-block; }
            .footer-col ul li a { display: inline-block; }
            .social-row { justify-content: center; }
            .copyright { text-align: center; margin-top: 25px; }
        }
    </style>
</head>
