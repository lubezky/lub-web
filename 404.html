<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página no encontrada</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff;
            color: #2d3748;
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 480px;
            width: 100%;
        }

        /* Contenedor y animación de la abeja */
        .bee-wrapper {
            margin: 0 auto 20px auto;
            width: 120px;
            height: 120px;
            animation: float 3s ease-in-out infinite;
        }

        /* Abeja construida en SVG directo (Súper ligera ~1KB) */
        .bee-svg {
            width: 100%;
            height: 100%;
        }

        h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 3.8rem;
            color: #f59e0b;
            line-height: 1;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.25rem;
            color: #4b5563;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .btn-home {
            display: inline-block;
            background-color: #2563eb;
            color: #ffffff;
            text-decoration: none;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.15rem;
            padding: 14px 28px;
            border-radius: 50px;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
            transition: all 0.2s ease;
        }

        .btn-home:hover {
            background-color: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
        }

        /* Animación suave de flotación */
        @keyframes float {
            0% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-14px) rotate(4deg);
            }
            100% {
                transform: translateY(0px) rotate(0deg);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Abeja integrada directamente (sin enlaces externos) -->
        <div class="bee-wrapper">
            <svg class="bee-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Alas -->
                <ellipse cx="35" cy="30" rx="14" ry="22" fill="#E0F2FE" opacity="0.8" transform="rotate(-25 35 30)"/>
                <ellipse cx="65" cy="30" rx="14" ry="22" fill="#E0F2FE" opacity="0.8" transform="rotate(25 65 30)"/>
                <!-- Cuerpo -->
                <ellipse cx="50" cy="55" rx="28" ry="22" fill="#FBBF24"/>
                <!-- Franjas negras -->
                <path d="M42 34C48 34 52 76 42 76" stroke="#1E293B" stroke-width="5" stroke-linecap="round"/>
                <path d="M58 34C64 34 68 76 58 76" stroke="#1E293B" stroke-width="5" stroke-linecap="round"/>
                <!-- Ojos amarillentos / mareados -->
                <circle cx="38" cy="50" r="3.5" fill="#1E293B"/>
                <circle cx="62" cy="50" r="3.5" fill="#1E293B"/>
                <!-- Boca confundida/simpática -->
                <path d="M46 62Q50 58 54 62" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                <!-- Antenas -->
                <path d="M43 35C40 25 34 22 30 24" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                <path d="M57 35C60 25 66 22 70 24" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                <circle cx="29" cy="24" r="3" fill="#1E293B"/>
                <circle cx="71" cy="24" r="3" fill="#1E293B"/>
            </svg>
        </div>

        <h1>Upps!</h1>
        <p>Parece que la página que buscas no existe.</p>

        <a href="/" class="btn-home">Volver al inicio</a>
    </div>

</body>
</html>
