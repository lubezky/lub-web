<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página no encontrada</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff;
            color: #2d3748;
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 480px;
            width: 100%;
        }

        /* Contenedor y animación de la abeja */
        .bee-wrapper {
            margin: 0 auto 10px auto;
            width: 220px;
            height: auto;
            animation: float 3s ease-in-out infinite;
        }

        .bee-img {
            width: 100%;
            height: auto;
            display: block;
        }

        h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 3.8rem;
            color: #f59e0b;
            line-height: 1;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.25rem;
            color: #4b5563;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .btn-home {
            display: inline-block;
            background-color: #2563eb;
            color: #ffffff;
            text-decoration: none;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.15rem;
            padding: 14px 28px;
            border-radius: 50px;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
            transition: all 0.2s ease;
        }

        .btn-home:hover {
            background-color: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
        }

        /* Animación suave de flotación */
        @keyframes float {
            0% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-12px) rotate(3deg);
            }
            100% {
                transform: translateY(0px) rotate(0deg);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Imagen de la abeja alojada directamente en tu repositorio -->
        <div class="bee-wrapper">
            <img src="/bee.png" alt="Abeja buscando con lupa" class="bee-img">
        </div>

        <h1>Upps!</h1>
        <p>Parece que la página que buscas no existe.</p>

        <a href="/" class="btn-home">Volver al inicio</a>
    </div>

</body>
</html>
